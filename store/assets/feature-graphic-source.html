<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 1024px; height: 500px; overflow: hidden; }
  .banner {
    width: 1024px; height: 500px;
    position: relative;
    background: linear-gradient(115deg, #10253F 0%, #1B2C46 35%, #213C68 62%, #164031 100%);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #ffffff;
    box-sizing: border-box;
  }
  .content {
    position: absolute;
    left: 56px; top: 0; bottom: 0;
    width: 540px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .title {
    font-size: 58px;
    font-weight: 800;
    letter-spacing: -1px;
    margin: 0;
  }
  .tagline {
    font-size: 21px;
    font-weight: 500;
    color: #cfe0ff;
    margin-top: 12px;
    line-height: 1.4;
  }
  .chips { margin-top: 24px; display: flex; gap: 12px; }
  .chip {
    background: rgba(255,255,255,0.12);
    border-radius: 999px;
    padding: 9px 18px;
    font-size: 17px;
    font-weight: 600;
  }
  svg { position: absolute; }
</style>
</head>
<body>
<div class="banner">
  <div class="content">
    <div class="title">FreeTuner</div>
    <div class="tagline">Tuner &middot; Metronome &middot; Chord Recognizer</div>
    <div class="chips">
      <div class="chip">Offline</div>
      <div class="chip">No Ads</div>
      <div class="chip">Free</div>
    </div>
  </div>

  <svg width="380" height="380" viewBox="0 0 512 512" style="position:absolute; left:660px; top:60px;">
    <circle cx="256" cy="256" r="200" fill="#141b2b" fill-opacity="0.55" stroke="#3a4a63" stroke-width="6"/>
    <path d="M 110 330 A 170 170 0 1 1 402 330" fill="none" stroke="#232f42" stroke-width="34" stroke-linecap="round"/>
    <path d="M 110 330 A 170 170 0 0 1 155 189" fill="none" stroke="#FF3355" stroke-width="26" stroke-linecap="butt"/>
    <path d="M 155 189 A 170 170 0 0 1 210 143" fill="none" stroke="#F5C518" stroke-width="26" stroke-linecap="butt"/>
    <path d="M 210 143 A 170 170 0 0 1 302 143" fill="none" stroke="#8BEA3E" stroke-width="26" stroke-linecap="butt"/>
    <path d="M 302 143 A 170 170 0 0 1 357 189" fill="none" stroke="#F5C518" stroke-width="26" stroke-linecap="butt"/>
    <path d="M 357 189 A 170 170 0 0 1 402 330" fill="none" stroke="#FF3355" stroke-width="26" stroke-linecap="butt"/>
    <line x1="256" y1="256" x2="256" y2="120" stroke="#8BEA3E" stroke-width="12" stroke-linecap="round" transform="rotate(4 256 256)"/>
    <circle cx="256" cy="256" r="30" fill="#E7EDF7"/>
    <circle cx="256" cy="256" r="18" fill="#1E2632"/>
    <circle cx="256" cy="256" r="9" fill="#8BEA3E"/>
  </svg>
</div>
</body>
</html>

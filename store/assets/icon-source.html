<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0; padding: 0;
    width: 512px; height: 512px;
    overflow: hidden;
  }
  .icon {
    width: 512px; height: 512px;
    position: relative;
    background: radial-gradient(circle at 32% 28%, #1a2740 0%, #0c1220 55%, #07090F 100%);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  svg { position: absolute; top: 0; left: 0; }
</style>
</head>
<body>
<div class="icon">
<svg width="512" height="512" viewBox="0 0 512 512">
  <!-- outer badge ring -->
  <circle cx="256" cy="256" r="200" fill="#141b2b" stroke="#2E3948" stroke-width="6"/>

  <!-- gauge track -->
  <path d="M 110 330 A 170 170 0 1 1 402 330" fill="none" stroke="#232f42" stroke-width="34" stroke-linecap="round"/>

  <!-- color bands (red - gold - green - gold - red), matching the in-app dial -->
  <path d="M 110 330 A 170 170 0 0 1 155 189" fill="none" stroke="#FF3355" stroke-width="26" stroke-linecap="butt"/>
  <path d="M 155 189 A 170 170 0 0 1 210 143" fill="none" stroke="#F5C518" stroke-width="26" stroke-linecap="butt"/>
  <path d="M 210 143 A 170 170 0 0 1 302 143" fill="none" stroke="#8BEA3E" stroke-width="26" stroke-linecap="butt"/>
  <path d="M 302 143 A 170 170 0 0 1 357 189" fill="none" stroke="#F5C518" stroke-width="26" stroke-linecap="butt"/>
  <path d="M 357 189 A 170 170 0 0 1 402 330" fill="none" stroke="#FF3355" stroke-width="26" stroke-linecap="butt"/>

  <!-- needle, pointing slightly right of center like "in tune" -->
  <line x1="256" y1="256" x2="256" y2="120" stroke="#8BEA3E" stroke-width="12" stroke-linecap="round" transform="rotate(4 256 256)"/>
  <circle cx="256" cy="256" r="30" fill="#E7EDF7"/>
  <circle cx="256" cy="256" r="18" fill="#1E2632"/>
  <circle cx="256" cy="256" r="9" fill="#8BEA3E"/>
</svg>
</div>
</body>
</html>
